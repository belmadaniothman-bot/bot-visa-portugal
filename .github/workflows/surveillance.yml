name: Surveillance visa Portugal

on:
  schedule:
    - cron: "*/15 * * * *"  # vérification toutes les 15 min (GitHub peut décaler de quelques minutes)
    - cron: "0 7 * * 5"     # rappel le vendredi à 8h, heure du Maroc (UTC+1)
  workflow_dispatch:         # lancement à la main depuis l'onglet "Actions"
    inputs:
      mode:
        description: "verif, test ou rappel"
        default: verif

permissions:
  contents: write

concurrency:
  group: bot-visa

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Lancer le bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.schedule == '0 7 * * 5' && 'rappel' || inputs.mode || 'verif' }}
        run: |
          case "$MODE" in
            test)   python3 bot.py --test ;;
            rappel) python3 bot.py --rappel ;;
            *)      python3 bot.py ;;
          esac

      - name: Sauvegarder l'état
        run: |
          git config user.name "bot-visa"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat.json
          if ! git diff --cached --quiet; then
            git commit -m "État mis à jour" && git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 2592000 ]; then
            # GitHub coupe les tâches planifiées après 60 jours sans activité
            git commit --allow-empty -m "Maintien actif" && git push
          fi
